name: CI / Deploy

# Every push and PR: typecheck, build, and run the end-to-end suite against a local wrangler dev.
# Pushes to main then migrate the remote D1 database, deploy the Worker (app + API) and smoke-test production.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build web app
        run: pnpm --filter web build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: |
          cp apps/worker/.dev.vars.example apps/worker/.dev.vars
          npx playwright test
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
      - uses: actions/upload-artifact@v5
        with:
          name: web-out
          path: apps/web/out
          retention-days: 1

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://cattle-management-api.andrewskea-as.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: web-out
          path: apps/web/out
      - name: Migrate remote D1
        run: pnpm --filter worker db:migrate
      - name: Deploy Worker
        run: pnpm --filter worker deploy
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production smoke tests
        run: npx playwright test --config=playwright.prod.config.ts
