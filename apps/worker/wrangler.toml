name = "cattle-management-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Only the custom domain is served, so Cloudflare Access (scripts/access-setup.sh) covers every way in.
workers_dev = false
preview_urls = false
routes = [{ pattern = "hooveswho.andrewskea.com", custom_domain = true }]

# Orkney Mart sales reports are checked every 3 hours; reminder notifications go out daily at 07:00 UTC (src/index.ts DAILY_CRON).
[triggers]
crons = ["17 */3 * * *", "0 7 * * *"]

[observability]
enabled = true

# The Next.js static export is served from the same origin as the API.
# Build it first: pnpm --filter web build
[assets]
directory = "../web/out"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cattle-management-db"
database_id = "99b323c3-60a4-4fb3-b564-939946c90ce2"
migrations_dir = "src/db/migrations"

[vars]
ENVIRONMENT = "production"
FEEDBACK_REPO = "AndrewSkea/cattle-cloudflare"
# Web Push public key for reminder notifications; its private half is the VAPID_PRIVATE_KEY secret.
VAPID_PUBLIC_KEY = "BKRC_8eXTEf0UH3-5gPopKg5dD1c1peJ7bm08RebCjF6LKhzED8h9k8ha-qXsSqNox1DvQSbFeP3YD5RYjUfLY8"

# Secrets (wrangler secret put <NAME>): JWT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GITHUB_FEEDBACK_TOKEN, VAPID_PRIVATE_KEY
# Local development: copy .dev.vars.example to .dev.vars
